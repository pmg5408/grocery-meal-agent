services:
  api:
    build: 
      context: .
      dockerfile: Dockerfile
    image: pantry_app:latest 
    container_name: pantry_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://pantry:pantry@db:5432/pantry
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_started

  celery_worker:
    image: pantry_app:latest
    container_name: pantry_worker
    command: celery -A worker.celery worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://pantry:pantry@db:5432/pantry
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      api: 
        condition: service_started
      db:
        condition: service_started

  celery_beat:
    image: pantry_app:latest
    container_name: pantry_beat
    command: celery -A worker.celery beat --loglevel=info
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://pantry:pantry@db:5432/pantry
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - api

  redis:
    image: redis:7-alpine
    container_name: pantry_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: postgres:15-alpine
    container_name: pantry_db_local
    restart: always
    environment:
      POSTGRES_USER: pantry
      POSTGRES_PASSWORD: pantry
      POSTGRES_DB: pantry
    ports:
      - "5433:5432" # 5433 used locally to avoid conflict with host Postgres
    volumes:
      - postgres_local_data:/var/lib/postgresql/data

volumes:
  postgres_local_data: